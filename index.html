<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İşim Çöz – Günlük hayatın dijital yardımcısı</title>
<meta name="description" content="Maaş zammı, kredi taksiti, KDV, kira artışı hesaplama ve hazır dilekçe, CV şablonları. Ücretsiz ve kolay.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2316263d'/%3E%3Ccircle cx='32' cy='17' r='5' fill='%2334d27b'/%3E%3Crect x='27' y='26' width='10' height='25' rx='5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16263d; --navy2:#1d3352; --bg:#f4f6f9; --card:#fff; --ink:#132033; --muted:#64708a; --line:#e3e8ef;
    --green:#1fa463; --green-bg:#e3f7ec; --blue:#2c6bed; --blue-bg:#e6efff; --chip:#eef2f7; --warn:#a15c00; --warn-bg:#fff4e0;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b1220; --card:#121b2b; --ink:#e9eef6; --muted:#93a0b8; --line:#223049; --chip:#1a2538;
      --green-bg:#123323; --blue-bg:#15274a; --warn-bg:#33240c; --warn:#f2b45a; --green:#34d27b; --blue:#78a6ff; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button,input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:960px;margin:0 auto;padding:0 18px}
  /* top bar */
  .top{background:var(--navy);color:#fff}
  .bar{display:flex;align-items:center;justify-content:space-between;height:64px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
  .mark{width:36px;height:36px;border-radius:11px;background:#fff;display:grid;place-items:center;position:relative}
  .mark::before{content:"";position:absolute;top:7px;width:6px;height:6px;border-radius:50%;background:var(--green)}
  .mark::after{content:"";position:absolute;top:16px;width:6px;height:13px;border-radius:3px;background:var(--navy)}
  .brand b{font-size:20px;font-weight:800;letter-spacing:.01em}
  .brand small{display:block;font-size:11px;opacity:.7;font-weight:500;margin-top:-2px}
  .navl{display:flex;gap:4px}
  .navl a{color:#cfd9ea;text-decoration:none;font-size:14px;font-weight:600;padding:8px 10px;border-radius:10px}
  .navl a:hover{background:rgba(255,255,255,.08);color:#fff}
  @media (max-width:640px){ .navl{display:none} }
  /* hero */
  .hero{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;padding:34px 0 46px}
  .hero h1{font-size:clamp(30px,6vw,46px);line-height:1.1;margin:0 0 10px;font-weight:800;letter-spacing:-.02em;text-align:center}
  .hero p{margin:0 auto 22px;text-align:center;color:#c5d1e4;font-size:17px;max-width:520px}
  .search{max-width:620px;margin:0 auto;background:#fff;border-radius:20px;padding:10px 10px 10px 18px;box-shadow:0 14px 40px rgba(0,0,0,.25)}
  .search textarea{width:100%;border:0;outline:none;resize:none;font-size:17px;color:#132033;background:transparent;min-height:48px;padding-top:6px}
  .search .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .search .hint{font-size:12px;color:#8a94a8}
  .go{border:0;background:var(--green-bg);color:#127a47;font-weight:700;padding:10px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
  @media (prefers-color-scheme: dark){ .go{background:#e3f7ec;color:#127a47} }
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
  .chips span{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px}
  .c1{background:#123b2a;color:#5be39a} .c2{background:#173058;color:#8db5ff} .c3{background:rgba(255,255,255,.1);color:#e6ecf5}
  #results{max-width:620px;margin:12px auto 0}
  #results a{display:flex;justify-content:space-between;background:rgba(255,255,255,.08);color:#fff;text-decoration:none;padding:12px 14px;border-radius:14px;margin-top:6px;font-weight:600}
  #results a:hover{background:rgba(255,255,255,.14)}
  #results .none{color:#c5d1e4;text-align:center;font-size:14px;margin-top:8px}
  /* sections */
  main{padding:26px 0 40px}
  h2{font-size:22px;margin:8px 0 14px;font-weight:800;letter-spacing:-.01em}
  .cats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media (min-width:760px){ .cats{grid-template-columns:repeat(4,1fr)} }
  .cat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;text-decoration:none;display:block;transition:.15s;position:relative}
  .cat:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(16,32,60,.08)}
  .cat svg{width:30px;height:30px;color:var(--blue)}
  .cat b{display:block;font-size:18px;margin-top:12px}
  .cat small{display:block;color:var(--muted);font-size:13px;margin-top:4px;line-height:1.4}
  .soon{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;background:var(--warn-bg);color:var(--warn);padding:3px 8px;border-radius:999px}
  .pop{display:grid;gap:8px;margin-top:6px}
  @media (min-width:760px){ .pop{grid-template-columns:1fr 1fr} }
  .pop a{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;font-weight:600}
  .pop a i{font-style:normal;width:34px;height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center;flex:0 0 auto}
  .pop a span{flex:1}
  .pop a em{font-style:normal;color:var(--muted)}
  /* tool page */
  .crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
  .crumb a{text-decoration:none;font-weight:600;color:var(--blue)}
  .tool{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;max-width:640px}
  .tool h1{font-size:26px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
  .tool .lead{color:var(--muted);margin:0 0 18px;font-size:15px;line-height:1.5}
  .f{display:grid;gap:6px;margin-bottom:14px}
  .f label{font-size:13px;font-weight:700;color:var(--muted)}
  .f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 13px;font-size:16px;width:100%;outline:none}
  .f input:focus,.f select:focus,.f textarea:focus{border-color:var(--blue)}
  .f textarea{min-height:110px;resize:vertical;line-height:1.5}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
  .seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer;font-size:14px}
  .seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .res{background:var(--green-bg);border-radius:16px;padding:16px;margin-top:6px}
  .res .big{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .res .k{font-size:13px;font-weight:700;color:var(--muted)}
  .res dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:12px 0 0;font-size:15px}
  .res dt{color:var(--muted)} .res dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .note{font-size:13px;color:var(--muted);line-height:1.55;margin-top:14px}
  .note.warn{background:var(--warn-bg);color:var(--warn);padding:10px 12px;border-radius:12px}
  table.plan{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;font-variant-numeric:tabular-nums}
  table.plan th,table.plan td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
  table.plan th:first-child,table.plan td:first-child{text-align:left}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btn{border:0;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;cursor:pointer}
  .btn.alt{background:var(--chip);color:var(--ink)}
  .doc{background:#fff;color:#111;border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:14px;white-space:pre-wrap;font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.6}
  .others{margin-top:22px;max-width:640px}
  .others a{display:inline-block;margin:0 6px 8px 0;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:14px;font-weight:600;text-decoration:none}
  .prose{max-width:680px;line-height:1.65}
  .prose h1{font-size:28px;font-weight:800}
  footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--muted);font-size:13px}
  footer .links{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:10px}
  footer a{text-decoration:none;font-weight:600}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%)}
  @media print{
    .top,.hero,footer,.crumb,.btns,.others,.tool form,.tool .lead,.tool h1,.note{display:none!important}
    body,main,.tool{background:#fff!important;border:0!important;padding:0!important}
    .doc{border:0;padding:0;margin:0}
  }
</style>
</head>
<body>
<div class="top">
  <div class="wrap bar">
    <a class="brand" href="#"><span class="mark" aria-hidden="true"></span><span><b>İŞİM ÇÖZ</b><small>Günlük hayatın dijital yardımcısı</small></span></a>
    <nav class="navl">
      <a href="#hesaplama">Hesaplama</a><a href="#belgeler">Belgeler</a><a href="#hakkinda">Hakkında</a>
    </nav>
  </div>
</div>
<div id="heroBox"></div>
<main><div class="wrap" id="view"></div></main>
<footer>
  <div class="wrap">
    <div class="links"><a href="#hakkinda">Hakkında</a><a href="#gizlilik">Gizlilik ve Kullanım</a><a href="#hesaplama">Tüm araçlar</a></div>
    <div>İşim Çöz'deki hesaplamalar ve şablonlar genel bilgilendirme amaçlıdır; resmi ya da hukuki tavsiye yerine geçmez. Önemli kararlar öncesinde ilgili kurum veya bir uzmana danışın.</div>
  </div>
</footer>
<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const TL = new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",minimumFractionDigits:2,maximumFractionDigits:2});
  const N2 = new Intl.NumberFormat("tr-TR",{maximumFractionDigits:2});
  const num = v => { v=String(v==null?"":v).trim().replace(/\s/g,"").replace(/[₺%]/g,"");
    if(v.includes(",")) v=v.replace(/\./g,"").replace(",",".");
    else if(/^-?\d{1,3}(\.\d{3})+$/.test(v)) v=v.replace(/\./g,"");
    const n=parseFloat(v); return isNaN(n)?NaN:n; };
  const fmtDate = d => d ? new Intl.DateTimeFormat("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric"}).format(new Date(d+"T12:00:00")) : "";
  const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
  function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove("on"),1800); }

  const ICON = {
    calc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>',
    doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>',
    scale:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/></svg>',
    bot:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="8" width="16" height="11" rx="4"/><path d="M12 4v4M9 13h.01M15 13h.01"/></svg>'
  };

  // ---------------- tool registry ----------------
  const TOOLS = [
    {id:"maas", cat:"hesaplama", e:"💼", t:"Maaş zammı hesaplama", d:"Zamlı maaşını ya da zam oranını bul.", k:"maaş maas zam zammı ücret ucret artış artis yüzde net brüt"},
    {id:"kredi", cat:"hesaplama", e:"🏦", t:"Kredi taksiti hesaplama", d:"KKDF ve BSMV dahil aylık taksit ve toplam geri ödeme.", k:"kredi taksit ihtiyaç ihtiyac faiz banka borç borc ödeme odeme vade bsmv kkdf"},
    {id:"kdv", cat:"hesaplama", e:"🧾", t:"KDV hesaplama", d:"KDV dahil ve hariç tutarı hesapla.", k:"kdv vergi fatura dahil hariç haric matrah"},
    {id:"yuzde", cat:"hesaplama", e:"％", t:"Yüzde hesaplama", d:"Yüzde bulma, oran ve değişim hesabı.", k:"yüzde yuzde oran indirim artış azalış değişim degisim kaç"},
    {id:"kira", cat:"hesaplama", e:"🏠", t:"Kira artışı hesaplama", d:"Yasal üst sınıra göre yeni kira bedeli.", k:"kira artış artisi zam ev sahibi kiracı kiraci tüfe tufe"},
    {id:"tarih", cat:"hesaplama", e:"📅", t:"Gün farkı ve yaş hesaplama", d:"İki tarih arasını ya da yaşını hesapla.", k:"tarih gün gun fark yaş yas doğum dogum kaç gün süre"},
    {id:"birikim", cat:"hesaplama", e:"🎯", t:"Birikim hedefi hesaplama", d:"Hedefine ulaşmak için ayda ne kadar biriktirmelisin?", k:"birikim tasarruf hedef para biriktir biriktirme ay"},
    {id:"dilekce", cat:"belgeler", e:"📝", t:"Genel dilekçe hazırla", d:"Herhangi bir kuruma dilekçe oluştur.", k:"dilekçe dilekce başvuru basvuru kurum belediye okul resmi yazı"},
    {id:"istifa", cat:"belgeler", e:"🚪", t:"İstifa dilekçesi hazırla", d:"İşverenine vereceğin istifa dilekçesi.", k:"istifa işten ayrılma isten ayrilma iş is dilekçe dilekce"},
    {id:"kirabildirim", cat:"belgeler", e:"✉️", t:"Kira artış bildirimi", d:"Kiracıya gönderilecek kira artış yazısı.", k:"kira artış bildirim ihtar ev sahibi kiracı yazı mektup"},
    {id:"cv", cat:"belgeler", e:"📄", t:"Basit CV hazırla", d:"Dakikalar içinde düzenli bir özgeçmiş.", k:"cv özgeçmiş ozgecmis iş başvurusu is basvurusu resume"}
  ];
  const TOOL = Object.fromEntries(TOOLS.map(t=>[t.id,t]));
  const norm = s => s.toLocaleLowerCase("tr-TR").replace(/[ıi̇]/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c");
  function findTools(q){
    const STOP=["istiyorum","istiyom","nasil","kadar","icin","bir","yapmak","lazim","bulmak","benim","bana","yardim","olan","olarak","gerek","gerekiyor","ogrenmek"];
    const words = norm(q).split(/[^a-z0-9]+/).filter(w=>w.length>=3 && !STOP.includes(w) && !w.startsWith("hesap") && !w.startsWith("hazirla"));
    if(!words.length) return [];
    return TOOLS.map(t=>{
      const hay = norm(t.t+" "+t.k+" "+t.d);
      let s=0; words.forEach(w=>{ if(hay.includes(w)) s+=2; else if(hay.split(/\s+/).some(h=>h.startsWith(w.slice(0,4)))) s+=1; });
      return {t,s};
    }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,4).map(x=>x.t);
  }

  // ---------------- views ----------------
  function hero(on){
    $("#heroBox").innerHTML = on ? `
    <section class="hero"><div class="wrap">
      <h1>Bugün hangi işini çözelim?</h1>
      <p>Sorununu yaz, sana uygun aracı hemen bulalım.</p>
      <form class="search" id="sForm">
        <textarea id="q" rows="2" placeholder="Örneğin: Maaş zammımı hesaplamak istiyorum…" aria-label="Sorununu yaz"></textarea>
        <div class="row"><span class="hint">Hesapla · Hazırla · Çöz</span><button class="go" type="submit">Çözüm bul →</button></div>
      </form>
      <div id="results"></div>
      <div class="chips"><span class="c1">Kolay kullanım</span><span class="c2">Ücretsiz araçlar</span><span class="c3">Üye olmak gerekmez</span></div>
    </div></section>` : "";
    if(on){
      const run=()=>{
        const q=$("#q").value.trim(), box=$("#results");
        if(!q){ box.innerHTML=""; return; }
        const hits=findTools(q);
        box.innerHTML = hits.length ? hits.map(t=>`<a href="#${t.id}"><span>${t.e} ${esc(t.t)}</span><span>→</span></a>`).join("")
          : `<div class="none">Bunun için henüz bir aracımız yok. Aşağıdaki kategorilere göz atabilirsin.</div>`;
      };
      $("#sForm").addEventListener("submit",e=>{ e.preventDefault(); run(); const f=$("#results a"); if(f && findTools($("#q").value).length===1) location.hash=f.getAttribute("href"); });
      $("#q").addEventListener("input",()=>{ clearTimeout(run.h); run.h=setTimeout(run,250); });
      $("#q").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); $("#sForm").requestSubmit(); } });
    }
  }

  function home(){
    hero(true);
    $("#view").innerHTML = `
      <h2>Neye ihtiyacın var?</h2>
      <div class="cats">
        <a class="cat" href="#hesaplama">${ICON.calc}<b>Hesaplama</b><small>Maaş, kredi, KDV, kira ve daha fazlası</small></a>
        <a class="cat" href="#belgeler">${ICON.doc}<b>Belge hazırla</b><small>Dilekçe, istifa yazısı, CV</small></a>
        <a class="cat" href="#haklarim"><span class="soon">Yakında</span>${ICON.scale}<b>Haklarım</b><small>Kiracı, tüketici ve çalışan hakları</small></a>
        <a class="cat" href="#akilli"><span class="soon">Yakında</span>${ICON.bot}<b>Akıllı yardım</b><small>Sorunu anlat, yapay zekâ yol göstersin</small></a>
      </div>
      <h2 style="margin-top:28px">Popüler çözümler</h2>
      <div class="pop">${["maas","kredi","kira","kdv","dilekce","cv"].map(id=>{const t=TOOL[id];return `<a href="#${id}"><i>${t.e}</i><span>${esc(t.t)}</span><em>→</em></a>`}).join("")}</div>`;
  }

  function category(cat){
    hero(false);
    const title = cat==="hesaplama"?"Hesaplama araçları":"Belge hazırla";
    $("#view").innerHTML = `<div class="crumb"><a href="#">Ana sayfa</a> / ${title}</div><h2>${title}</h2>
      <div class="pop">${TOOLS.filter(t=>t.cat===cat).map(t=>`<a href="#${t.id}"><i>${t.e}</i><span>${esc(t.t)}<br><small style="color:var(--muted);font-weight:500">${esc(t.d)}</small></span><em>→</em></a>`).join("")}</div>`;
  }

  function soon(name, text){
    hero(false);
    $("#view").innerHTML = `<div class="crumb"><a href="#">Ana sayfa</a> / ${name}</div>
      <div class="tool"><h1>${name}</h1><p class="lead">${text}</p>
      <p class="note">Bu bölüm hazırlanıyor. Şimdilik hesaplama araçlarımızı ve belge şablonlarımızı kullanabilirsin.</p>
      <div class="btns"><a class="btn" href="#hesaplama" style="text-decoration:none">Hesaplama araçları</a><a class="btn alt" href="#belgeler" style="text-decoration:none">Belgeler</a></div></div>`;
  }

  function page(id, inner, after){
    hero(false);
    const t=TOOL[id];
    const others=TOOLS.filter(x=>x.cat===t.cat&&x.id!==id);
    $("#view").innerHTML = `<div class="crumb"><a href="#">Ana sayfa</a> / <a href="#${t.cat}">${t.cat==="hesaplama"?"Hesaplama":"Belgeler"}</a></div>
      <div class="tool"><h1>${t.e} ${esc(t.t)}</h1><p class="lead">${esc(t.d)}</p>${inner}</div>
      <div class="others"><h2 style="font-size:17px">Diğer araçlar</h2>${others.map(o=>`<a href="#${o.id}">${o.e} ${esc(o.t)}</a>`).join("")}</div>`;
    document.title = t.t+" – İşim Çöz";

  function docPage(id, fields, build, extraNote){
    const inner = `<form onsubmit="return false">${fields.map(([k,label,ph,type,val])=>{
        const v = type==="date" && (k==="tarih") ? today() : (val||"");
        return `<div class="f"><label for="d_${k}">${esc(label)}</label>${type==="area"?`<textarea id="d_${k}" placeholder="${esc(ph)}">${esc(v)}</textarea>`:`<input id="d_${k}" ${type==="date"?'type="date"':""} placeholder="${esc(ph)}" value="${esc(v)}">`}</div>`;
      }).join("")}</form>
      <div class="k" style="font-size:13px;font-weight:700;color:var(--muted);margin-top:4px">Önizleme</div>
      <div class="doc" id="doc"></div>
      <div class="btns"><button class="btn" type="button" id="copy">Metni kopyala</button><button class="btn alt" type="button" id="print">Yazdır / PDF olarak kaydet</button></div>
      <p class="note">Bilgilerin yalnızca senin cihazında işlenir, hiçbir yere gönderilmez.${extraNote?" "+esc(extraNote):""}</p>`;
    page(id, inner, ()=>{
      const read=()=>Object.fromEntries(fields.map(([k])=>[k,$("#d_"+k).value.trim()]));
      live(()=>{ $("#doc").textContent=build(read()); });
      $("#copy").onclick=async()=>{ try{ await navigator.clipboard.writeText($("#doc").textContent); toast("Kopyalandı"); }catch(e){ const r=document.createRange(); r.selectNodeContents($("#doc")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Metni seçtim, kopyalayabilirsin"); } };
      $("#print").onclick=()=>{ try{ window.print(); }catch(e){ toast("Yazdırma bu ekranda desteklenmiyor"); } };
    });
  }

  function about(){
    hero(false);
    $("#view").innerHTML = `<div class="prose"><h1>Hakkında</h1>
      <p><b>İşim Çöz</b>, günlük hayatta karşılaştığın küçük ama can sıkıcı işleri hızlıca çözmen için hazırlanmış ücretsiz bir yardımcıdır. Maaş zammı, kredi taksiti, KDV ya da kira artışı hesaplayabilir; dilekçe, istifa yazısı ve CV gibi belgeleri dakikalar içinde hazırlayabilirsin.</p>
      <p>İlkelerimiz basit: kullanıcıyı yormamak, mümkün olduğunca ücretsiz olmak, karmaşık işleri basitleştirmek ve kişisel bilgileri gereksiz yere toplamamak.</p>
      <p>Yakında <b>Haklarım</b> bölümünde kiracı, tüketici ve çalışan haklarıyla ilgili kaynaklı rehberler ekleyeceğiz.</p></div>`;
  }
  function privacy(){
    hero(false);
    $("#view").innerHTML = `<div class="prose"><h1>Gizlilik ve Kullanım</h1>
      <p><b>Verilerin:</b> Hesaplama araçlarına ve belge formlarına yazdığın bilgiler yalnızca kendi tarayıcında işlenir; bir sunucuya gönderilmez ve saklanmaz.</p>
      <p><b>Bilgilerin doğruluğu:</b> Hesaplamalar ve şablonlar genel bilgilendirme amaçlıdır. Oranlar (KDV, KKDF, BSMV, kira artış sınırı gibi) mevzuatla değişebilir. Sonuçlar resmi, mali ya da hukuki tavsiye yerine geçmez; önemli kararlar öncesinde ilgili kurum veya bir uzmana danış.</p>
      <p><b>Reklamlar:</b> Site ileride ücretsiz kalabilmek için reklam gösterebilir. Bu durumda reklam sağlayıcıların çerez kullanımı burada ayrıca açıklanacaktır.</p></div>`;
  }

  // ---------------- router ----------------
  function route(){
    const h = location.hash.slice(1);
    document.title = "İşim Çöz – Günlük hayatın dijital yardımcısı";
    if(TOOLS_VIEW[h]) TOOLS_VIEW[h]();
    else if(h==="hesaplama"||h==="belgeler") category(h);
    else if(h==="haklarim") soon("Haklarım","Kiracı, tüketici ve çalışan haklarını sade bir dille, kaynaklarıyla anlatan rehberler.");
    else if(h==="akilli") soon("Akıllı yardım","Sorununu kendi cümlelerinle anlat; yapay zekâ seni doğru araca ve adımlara yönlendirsin.");
    else if(h==="hakkinda") about();
    else if(h==="gizlilik") privacy();
    else home();
    window.scrollTo(0,0);
  }
  window.addEventListener("hashchange",route);
  route();
})();
</script>
</body>
</html>
